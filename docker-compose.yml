services:
  bookkeeping:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_PATH=/data/bookkeeping.sqlite
      - UPLOADS_DIR=/app/uploads
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    restart: unless-stopped
